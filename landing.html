<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OKI SHIELD | HD INDUSTRIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0a0a0c;
            --card: #141417;
            --accent: #00f3ff;
            --text: #ffffff;
            --border: #27272a;
            --input-bg: #1c1c21;
        }

        .light-mode {
            --bg: #f4f4f5;
            --card: #ffffff;
            --accent: #2563eb;
            --text: #09090b;
            --border: #e4e4e7;
            --input-bg: #f1f1f4;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            transition: all 0.4s ease;
            overflow: hidden;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        /* Razor Sharp Card */
        .main-container {
            background-color: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            position: relative;
            z-index: 10;
        }

        /* Clean HUD Inputs */
        .input-box {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-weight: 500;
            transition: all 0.2s;
        }
        .input-box:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 243, 255, 0.1);
        }

        .btn-confirm {
            background-color: var(--accent);
            color: #000;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s;
        }
        .btn-confirm:active { transform: scale(0.98); }

        /* Navigation Buttons */
        .nav-btn {
            position: fixed;
            top: 20px;
            padding: 8px 16px;
            border: 1px solid var(--border);
            background: var(--card);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            z-index: 50;
        }

        /* Stats Drawer */
        #stats-drawer {
            position: fixed;
            right: -450px; /* Hidden by default */
            top: 0;
            width: 450px;
            height: 100vh;
            background: var(--card);
            border-left: 1px solid var(--border);
            z-index: 100;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 30px;
            overflow-y: auto;
        }
        #stats-drawer.open { right: 0; }

        .stats-table th { text-align: left; padding: 12px 8px; font-size: 10px; text-transform: uppercase; color: #71717a; border-bottom: 1px solid var(--border); }
        .stats-table td { padding: 12px 8px; font-size: 12px; border-bottom: 1px solid var(--border); }

        #auth-overlay {
            position: fixed;
            inset: 0;
            background: var(--accent);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="auth-overlay">
        <h1 class="text-black text-6xl font-black orbitron italic">AUTHORIZED</h1>
    </div>

    <button onclick="toggleTheme()" class="nav-btn right-[150px] orbitron uppercase">
        Theme: <span id="theme-label">Void</span>
    </button>
    <button onclick="toggleStats()" class="nav-btn right-5 orbitron uppercase text-cyan-500">
        Visitor Logs
    </button>

    <div id="main-ui" class="main-container w-[500px] p-10 rounded-xl">
        <div class="flex justify-between items-center mb-10 pb-6 border-b border-white/5">
            <div>
                <h1 class="orbitron text-2xl font-bold tracking-tight">OKI <span class="text-cyan-500" id="brand-accent">SHIELD</span></h1>
                <p class="text-[10px] uppercase tracking-widest opacity-40 font-bold mt-1">Terminal Access v3.0</p>
            </div>
            <div id="tag-badge" class="px-3 py-1 bg-white/5 rounded text-[10px] font-mono opacity-50">IDLE</div>
        </div>

        <div id="content-area" class="min-h-[250px] flex flex-col justify-center">
            <div id="idle-view" class="text-center space-y-6">
                <div class="w-16 h-16 border-2 border-dashed border-cyan-500/20 rounded-full mx-auto animate-spin flex items-center justify-center">
                    <div class="w-2 h-2 bg-cyan-500 rounded-full shadow-[0_0_10px_#00f3ff]"></div>
                </div>
                <p class="text-sm font-medium opacity-60 tracking-wide uppercase">Waiting for RFID scan...</p>
            </div>

            <div id="active-view" class="hidden animate-in fade-in zoom-in duration-300">
                <div id="reg-form" class="space-y-6">
                    <div class="space-y-2">
                        <label class="text-[11px] font-bold uppercase opacity-50 ml-1">Full Name</label>
                        <input id="name" type="text" placeholder="John Doe" class="input-box w-full p-4 rounded-lg text-base">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[11px] font-bold uppercase opacity-50 ml-1">Age</label>
                        <input id="age" type="number" placeholder="24" class="input-box w-full p-4 rounded-lg text-base">
                    </div>
                    <button onclick="register()" class="btn-confirm w-full py-4 rounded-lg mt-4">Confirm Registration</button>
                </div>

                <div id="check-form" class="hidden text-center space-y-6">
                    <div>
                        <p class="text-xs uppercase opacity-40 font-bold mb-1">Active Subject</p>
                        <h2 id="v-name" class="text-4xl font-bold orbitron uppercase"></h2>
                    </div>
                    <div class="py-4 px-6 bg-red-500/10 border border-red-500/20 rounded-lg">
                        <p class="text-red-500 text-[10px] font-bold uppercase tracking-widest">Session in progress</p>
                    </div>
                    <button onclick="checkout()" class="w-full py-4 border border-red-500 text-red-500 font-bold rounded-lg hover:bg-red-500 hover:text-white transition-all">TERMINATE SESSION</button>
                </div>
            </div>
        </div>

        <div class="mt-10 pt-6 border-t border-white/5 flex justify-between items-center text-[10px] font-bold opacity-30">
            <span id="port-info">PORT: COM6</span>
            <span id="uid-display">UID: 0x0000</span>
        </div>
    </div>

    <div id="stats-drawer">
        <div class="flex justify-between items-center mb-8">
            <h2 class="orbitron text-lg font-bold">Visitor Logs</h2>
            <button onclick="toggleStats()" class="text-xs opacity-50 hover:opacity-100">CLOSE ✕</button>
        </div>
        
        <input type="date" id="date-picker" onchange="fetchStats()" class="input-box w-full p-2 mb-6 rounded text-xs outline-none">

        <table class="w-full stats-table">
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>In</th>
                    <th>Out</th>
                    <th>State</th>
                </tr>
            </thead>
            <tbody id="stats-body">
                </tbody>
        </table>
    </div>

    <script>
        const socket = io('http://localhost:5000');
        let currentUID = null, activeID = null;

        document.getElementById('date-picker').valueAsDate = new Date();

        function applyTheme(theme) {
            const label = document.getElementById('theme-label');
            const brand = document.getElementById('brand-accent');
            if (theme === 'light') {
                document.body.classList.add('light-mode');
                label.innerText = 'Solar';
                brand.style.color = '#2563eb';
            } else {
                document.body.classList.remove('light-mode');
                label.innerText = 'Void';
                brand.style.color = '#00f3ff';
            }
        }

        const savedTheme = localStorage.getItem('oki_hd_theme') || 'dark';
        applyTheme(savedTheme);

        function toggleTheme() {
            const isLight = document.body.classList.contains('light-mode');
            const next = isLight ? 'dark' : 'light';
            localStorage.setItem('oki_hd_theme', next);
            applyTheme(next);
        }

        function toggleStats() {
            const drawer = document.getElementById('stats-drawer');
            drawer.classList.toggle('open');
            if(drawer.classList.contains('open')) fetchStats();
        }

        function fetchStats() {
            const date = document.getElementById('date-picker').value;
            socket.emit('get_stats', { date });
        }

        socket.on('stats_data', (data) => {
            const container = document.getElementById('stats-body');
            container.innerHTML = data.map(v => `
                <tr>
                    <td class="font-bold">${v.name}</td>
                    <td>${new Date(v.check_in).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td>
                    <td>${v.check_out ? new Date(v.check_out).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--'}</td>
                    <td>
                        <span class="inline-block w-2 h-2 rounded-full ${v.check_out ? 'bg-zinc-600' : 'bg-cyan-500 animate-pulse'}"></span>
                    </td>
                </tr>
            `).join('');
        });

        socket.on('rfid_scan', (data) => {
            currentUID = data.uid;
            document.getElementById('uid-display').innerText = `UID: ${currentUID}`;
            document.getElementById('tag-badge').innerText = 'DETECTED';
            document.getElementById('tag-badge').classList.add('bg-cyan-500', 'text-black', 'opacity-100');

            gsap.to("#idle-view", { opacity: 0, duration: 0.2, onComplete: () => {
                document.getElementById('idle-view').classList.add('hidden');
                document.getElementById('active-view').classList.remove('hidden');
                if (data.active_visitor.length > 0) {
                    activeID = data.active_visitor[0].id;
                    document.getElementById('v-name').innerText = data.active_visitor[0].name;
                    document.getElementById('reg-form').classList.add('hidden');
                    document.getElementById('check-form').classList.remove('hidden');
                } else {
                    document.getElementById('reg-form').classList.remove('hidden');
                    document.getElementById('check-form').classList.add('hidden');
                    document.getElementById('name').focus();
                }
            }});
        });

        function register() {
            const n = document.getElementById('name').value, a = document.getElementById('age').value;
            if(!n || !a) return;
            socket.emit('register_user', { uid: currentUID, name: n, age: a });
        }

        function checkout() { socket.emit('checkout_user', { id: activeID }); }

        socket.on('action_complete', () => {
            const overlay = document.getElementById('auth-overlay');
            overlay.style.display = 'flex';
            gsap.fromTo(overlay, { opacity: 0 }, { opacity: 1, duration: 0.3 });
            setTimeout(() => location.reload(), 1000);
        });
    </script>
</body>
</html>
